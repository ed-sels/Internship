<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
  <body class="p-8 max-w-3xl">
    
    <h1 class="font-semibold text-5xl text-emerald-800">
      California Redwood Trees
    </h1>

    <p class="mt-1 font-medium text-slate-600">
      Majestic Giants of California's Coast
    </p>

    <div class="mt-6 flex gap-6">
      <img
        class="w-48 rounded-xl"
        src="redwood-1.jpg"
        alt="Redwood trees"
      />
      <img
        class="w-48 rounded-xl"
        src="redwood-2.png"
        alt="Redwood trees"
      />
      <img
        class="w-48 rounded-xl"
        src="redwood-3.jpg"
        alt="Redwood trees"
      />
    </div>

    <p class="mt-6 text-slate-700 text-lg">
      California's redwood trees are towering marvels of nature, some standing
      over 300 feet tall and living for over 2,000 years. These ancient forests
      inspire awe and offer serene beauty.
    </p>

    <button
      type="button"
      class="mt-4 bg-emerald-700 text-white px-5 py-2 rounded-lg flex items-center gap-2"
    >
      <span>Load more</span>

      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 20 20"
        fill="currentColor"
        class="w-5 h-5 animate-spin"
        aria-hidden="true"
      >
        <path
          fill-rule="evenodd"
          d="M10 3a1 1 0 011 1v10.586l3.293-3.293a1 1 0 111.414 1.414l-5 5a1 1 0 01-1.414 0l-5-5a1 1 0 111.414-1.414L9 14.586V4a1 1 0 011-1z"
          clip-rule="evenodd"
        />
      </svg>
    </button>
</body>
</html>
